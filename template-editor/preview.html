<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Template preview</title>
  <!-- The template editor's preview (I-106): the template's stylesheets go in
       the two <style> elements, so they cannot touch the editor's own UI. -->
  <link rel="stylesheet" href="css/preview.css">
  <style id="slipr-preview-theme"></style>
  <style id="slipr-preview-reader"></style>
  <script type="module" src="js/preview/preview.js"></script>
</head>
<body>
  <main id="slipr-preview-root" class="pv-root" aria-live="off"></main>
</body>
</html>
