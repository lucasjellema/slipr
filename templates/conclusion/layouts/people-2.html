<div class="slipr-layout cnc cnc--people cnc-light">
  <p class="cnc-kicker" data-slot="kicker"></p>
  <h2 class="cnc-title" data-slot="title"></h2>
  <div class="cnc-cards cnc-cards--people" data-slot="cards">
    <template>
      <div class="cnc-card cnc-card--person">
        <img class="cnc-person-photo" data-field="image" alt="">
        <p class="cnc-person-name" data-field="name"></p>
        <h3 class="cnc-person-role" data-field="role"></h3>
        <div class="cnc-card-text" data-field="text"></div>
      </div>
    </template>
  </div>
  <img class="cnc-logo" src="../assets/logos/conclusion-logo.png" alt="">
  <span class="cnc-bar" aria-hidden="true"></span>
  <img class="cnc-footer" src="../assets/decor/footer-band.svg" alt="">
</div>
