<div class="slipr-layout cnc cnc--facts cnc-dark">
  <img class="cnc-photo" data-slot="image" alt="">
  <span class="cnc-overlay" aria-hidden="true"></span>
  <p class="cnc-kicker" data-slot="kicker"></p>
  <h2 class="cnc-title" data-slot="title"></h2>
  <div class="cnc-cards cnc-cards--facts" data-slot="cards">
    <template>
      <div class="cnc-card cnc-card--fact">
        <img class="cnc-card-icon" data-field="icon" alt="">
        <div class="cnc-card-content">
          <p class="cnc-fact-value" data-field="value"></p>
          <p class="cnc-fact-label" data-field="label"></p>
        </div>
      </div>
    </template>
  </div>
  <img class="cnc-logo" src="../assets/logos/conclusion-logo.png" alt="">
  <span class="cnc-bar" aria-hidden="true"></span>
  <img class="cnc-footer" src="../assets/decor/footer-band.svg" alt="">
</div>
