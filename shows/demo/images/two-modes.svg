<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Two modes</title>
  <desc id="d">On the left a big screen in front of an audience; on the right a single reader with a laptop showing a slide plus expandable panels and notes.</desc>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- audience: big screen -->
  <rect x="120" y="140" width="600" height="340" rx="14" fill="#1F3A5F"/>
  <rect x="170" y="190" width="300" height="34" rx="6" fill="#F2A900"/>
  <rect x="170" y="260" width="420" height="20" rx="6" fill="#FFFFFF" opacity="0.8"/>
  <rect x="170" y="300" width="360" height="20" rx="6" fill="#FFFFFF" opacity="0.8"/>
  <rect x="170" y="340" width="390" height="20" rx="6" fill="#FFFFFF" opacity="0.8"/>
  <rect x="400" y="480" width="40" height="80" fill="#5B6573"/>
  <g fill="#5B6573">
    <circle cx="200" cy="680" r="34"/><rect x="160" y="720" width="80" height="90" rx="30"/>
    <circle cx="330" cy="680" r="34"/><rect x="290" y="720" width="80" height="90" rx="30"/>
    <circle cx="460" cy="680" r="34"/><rect x="420" y="720" width="80" height="90" rx="30"/>
    <circle cx="590" cy="680" r="34"/><rect x="550" y="720" width="80" height="90" rx="30"/>
  </g>
  <text x="420" y="100" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#1F3A5F" text-anchor="middle">Audience</text>

  <line x1="800" y1="80" x2="800" y2="820" stroke="#F4F6F9" stroke-width="6"/>

  <!-- reader: laptop -->
  <rect x="900" y="200" width="580" height="380" rx="16" fill="#F4F6F9" stroke="#1F3A5F" stroke-width="6"/>
  <rect x="860" y="580" width="660" height="30" rx="10" fill="#1F3A5F"/>
  <rect x="930" y="230" width="120" height="320" rx="6" fill="#FFFFFF"/>
  <rect x="945" y="250" width="90" height="12" rx="4" fill="#F2A900"/>
  <rect x="945" y="278" width="70" height="10" rx="4" fill="#5B6573" opacity="0.5"/>
  <rect x="945" y="300" width="80" height="10" rx="4" fill="#5B6573" opacity="0.5"/>
  <rect x="1070" y="230" width="270" height="150" rx="6" fill="#1F3A5F"/>
  <rect x="1090" y="250" width="140" height="16" rx="4" fill="#F2A900"/>
  <rect x="1070" y="395" width="270" height="10" rx="4" fill="#5B6573" opacity="0.6"/>
  <rect x="1070" y="415" width="240" height="10" rx="4" fill="#5B6573" opacity="0.6"/>
  <rect x="1070" y="440" width="270" height="40" rx="6" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="1085" y="468" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="22" fill="#1F3A5F">▸ more detail</text>
  <rect x="1360" y="230" width="100" height="90" rx="6" fill="#FFF6DB"/>
  <circle cx="1180" cy="660" r="34" fill="#5B6573"/><rect x="1140" y="700" width="80" height="90" rx="30" fill="#5B6573"/>
  <text x="1190" y="140" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#1F3A5F" text-anchor="middle">Reader</text>
</svg>
